<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Kalu Lab</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08191C">
<style>
  :root{ --ground:#08191C; --ink:#E9F1F0; --ink-2:#8FA9A9; --accent:#F2703F; --line:#1E4044; color-scheme: dark; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ground); color:var(--ink); font-family:"Helvetica Neue",Arial,sans-serif; line-height:1.6;
       min-height:100vh; display:grid; place-items:center; padding:24px 16px}
  main{max-width:520px; text-align:center}
  h1{font-size:28px; margin:0}
  p{color:var(--ink-2); margin:12px 0 0}
  nav{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:24px}
  a{display:inline-block; border-radius:12px; padding:12px 18px; font-weight:700; text-decoration:none; border:1px solid var(--line); color:var(--ink)}
  a.pri{background:var(--accent); border-color:var(--accent); color:#fff}
  a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Esta página no existe</h1>
  <p>Puede que el link esté mal copiado. Si buscabas el simulador, está en simulador.kalulab.store.</p>
  <nav><a class="pri" href="https://simulador.kalulab.store/">Entrar al Simulador 107</a><a href="/">Ir a Kalu Lab</a></nav>
</main>
</body>
</html>
